<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Denied</title>
</head>
<body style="font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f9fa;">
    <div style="text-align: center; background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px;">
        <h1 style="color: #dc3545; font-size: 48px; margin: 0;">403</h1>
        <h2>Access Denied</h2>
        <p style="color: #6c757d;">
            You are signed in as <strong>{{ request.user.get_role_display|default:request.user.username }}</strong>, which does not have administrative privileges for this control center.
        </p>
        <hr style="margin: 20px 0;">
        <a href="{% url 'logout' %}" style="display: inline-block; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">Log Out & Switch Account</a>
    </div>
</body>
</html>
