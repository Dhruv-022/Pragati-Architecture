<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPLADS Monitoring System — Sign In</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #151c2c;
            --border-color: #232d42;
            --accent-blue: #0284c7;
            --accent-hover: #0369a1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: #ef4444;
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .brand-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .error-alert {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="brand-header">
            <h1>MPLADS MONITORING</h1>
            <p>Government Project Intelligence Platform</p>
        </div>

        {% if form.errors %}
        <div class="error-alert">
            Invalid User ID/Username or password. Please verify your credentials and try again.
        </div>
        {% endif %}

        <form method="POST">
    {% csrf_token %}
    {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    <div class="form-group">
        <label for="id_username">User ID / Username</label>
        <input type="text" name="username" id="id_username" required autofocus placeholder="Enter your assigned User ID">
    </div>

    <div class="form-group">
        <label for="id_password">Password</label>
        <input type="password" name="password" id="id_password" required placeholder="••••••••">
    </div>

    <button type="submit" class="btn-submit">Sign In to Workspace</button>
</form>

        <div class="footer-note">
            Restricted System — Access Monitored & Audited
        </div>
    </div>
</div>

</body>
</html>
